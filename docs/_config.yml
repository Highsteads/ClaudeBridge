# GitHub Pages configuration for the Claude Bridge documentation site.
# Source: the docs/ folder of the main branch, built by GitHub's own Jekyll.
# The theme is fetched at build time (jekyll-remote-theme), so nothing is
# vendored here and there is no Gemfile to keep current.
title: Claude Bridge
description: >-
  Talk to your Indigo home automation in plain English. Claude gets live
  access to your devices, variables, scripts and event log through 168 tools.
url: https://highsteads.github.io
baseurl: /ClaudeBridge
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false
heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/Highsteads/ClaudeBridge
  Releases: https://github.com/Highsteads/ClaudeBridge/releases
aux_links_new_tab: false
footer_content: >-
  © 2026 CliveS · MIT licence · Written by Claude, through the plugin it describes.
