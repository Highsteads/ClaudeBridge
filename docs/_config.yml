# GitHub Pages configuration for the Claude Bridge guide.
# Source: the docs/ folder of the main branch, built by GitHub's own Jekyll.
# The theme is fetched at build time (jekyll-remote-theme), so nothing is
# vendored here and there is no Gemfile to keep current.
title: Claude Bridge for Indigo
description: >-
  A plain-English guide to the Claude Bridge plugin for Indigo, which lets
  Claude see and control your house through 71 tools.
url: https://highsteads.github.io
baseurl: /ClaudeBridge
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false
heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/Highsteads/ClaudeBridge
  Download: https://github.com/Highsteads/ClaudeBridge/releases/latest
aux_links_new_tab: false
footer_content: >-
  © 2026 CliveS · MIT licence
