name: tests

# The suite runs standalone — tests/conftest.py stubs the `indigo` module and
# falls back to the repo bundle when no live Indigo install exists, so plain
# ubuntu runners work. Only pytest is installed: the plugin needs nothing beyond
# the standard library, and running the suite on a bare Python proves it
# (tests/test_no_third_party_deps.py checks every import as well).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # matches Indigo 2025.2's embedded Python

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Lint (ruff — errors only, see ruff.toml)
        run: |
          pip install ruff
          ruff check .

      - name: Check the generated tool reference (docs/tools.md) is current
        run: python scripts/generate_tool_doc.py --check
